<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History_migrant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="top-bar">
    <button onclick="goHome()">🏠</button>
    </div>

    <div class="question">
      <div class="progress-wrap">
        <div class="progress-info">
          <span class="progress-text" id="progLabel">Вопрос 1 из 10</span>
          <span class="progress-text" id="progPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progFill" style="width: 0%"></div>
        </div>
      </div>
      <p id="question"></p>
      <div class="button">
        <button id="answer1" onclick="answer(0)"></button>
        <button id="answer2" onclick="answer(1)"></button>
        <button id="answer3" onclick="answer(2)"></button>
        <button id="answer4" onclick="answer(3)"></button>
        <button id="nextBtn" class="hidden" onclick="main()">Продолжить</button>
      </div>
      <div id="infoPanel" class="hidden">
        <h3>📖 Дополнительная информация</h3>
        <p id="infoText"></p>
      </div>
      <div id="results" class="hidden">
        <p class="results-title">Результаты</p>

        <div class="chart-wrap">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle
              cx="90"
              cy="90"
              r="70"
              fill="none"
              stroke="rgba(255,255,255,0.08)"
              stroke-width="18"
            />
            <circle
              id="arc-correct"
              cx="90"
              cy="90"
              r="70"
              fill="none"
              stroke="#22c55e"
              stroke-width="18"
              stroke-dasharray="0 440"
              stroke-linecap="round"
            />
            <circle
              id="arc-wrong"
              cx="90"
              cy="90"
              r="70"
              fill="none"
              stroke="#ef4444"
              stroke-width="18"
              stroke-dasharray="0 440"
              stroke-linecap="round"
            />
          </svg>
          <div class="pct-label">
            <span class="pct-num" id="pct-num">0%</span>
            <span class="pct-sub">верно</span>
          </div>
        </div>

        <div class="legend">
          <div class="leg-item">
            <div class="dot dot-correct"></div>
            Правильно
          </div>
          <div class="leg-item">
            <div class="dot dot-wrong"></div>
            Неправильно
          </div>
        </div>

        <div class="counts">
          <div class="count-card correct-card">
            <div class="count-num" id="cnt-correct">0</div>
            <div class="count-label">правильных</div>
          </div>
          <div class="count-card wrong-card">
            <div class="count-num" id="cnt-wrong">0</div>
            <div class="count-label">неправильных</div>
          </div>
        </div>

        <button class="replay" onclick="window.location.href = 'index.html'">
          Начать заново
        </button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
